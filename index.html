<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Task Tracker</title>
    </head>
    <body>
        <h1>Task Tracker</h1>
        <form id="task-form">
            <input type="text" id="task-input" placeholder="Enter a task" required>
            <button type="submit">Add Task</button>
            <button type="button" id="clear-tasks">Clear Tasks</button>
        </form>
        <h2>Task List</h2>
        <ul id="task-list">
        </ul>
    </body>
</html>
